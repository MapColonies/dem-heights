name: pull_request

on: pull_request

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  eslint:
    name: Run eslint
    # release-please opens its PR with GH_PAT, which triggers CI; it only bumps versions and the changelog.
    if: &not-release-pr ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24.x]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Init Nodejs
        uses: MapColonies/shared-workflows/actions/init-npm@init-npm-v1
        with:
          node-version: ${{ matrix.node }}

      - name: Run linters
        uses: wearerequired/lint-action@v3
        with:
          eslint: true
          prettier: true
          eslint_extensions: ts
          tsc: true
          continue_on_error: false

  openapi-lint:
    name: Run OpenAPI lint Check
    if: *not-release-pr
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Init Nodejs
        uses: MapColonies/shared-workflows/actions/init-npm@init-npm-v1

      - name: OpenAPI Lint Checks
        run: npm run lint:openapi

  helm-lint:
    name: Run Helm lint Check
    if: *not-release-pr
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Helm Lint Checks
        uses: MapColonies/shared-workflows/actions/helm-lint@helm-lint-v1

  security:
    if: *not-release-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  tests:
    name: Run Tests
    if: *not-release-pr
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24.x]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Init Nodejs
        uses: MapColonies/shared-workflows/actions/init-npm@init-npm-v1
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm run test

      - uses: actions/upload-artifact@v7
        with:
          name: Test Reporters Node-${{ matrix.node }}
          path: reports/**

  build_docker_image:
    if: *not-release-pr
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
