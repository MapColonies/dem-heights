name: pull_request

on: pull_request

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  changes:
    # release-please opens its PR with GH_PAT, which triggers CI; it only bumps versions and the changelog.
    # Every job needs this one, so skipping it skips them all.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    outputs:
      helm: ${{ steps.filter.outputs.helm }}
      openapi: ${{ steps.filter.outputs.openapi }}
      tests: ${{ steps.filter.outputs.tests }}
      docker: ${{ steps.filter.outputs.docker }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            deps: &deps
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'
              - '.npmrc'
            build: &build
              - *deps
              - 'src/**'
              - 'config/**'
              - 'openapi3.yaml'
              - 'tsconfig*.json'
            helm:
              - '.github/workflows/**'
              - 'helm/**'
            openapi:
              - *deps
              - 'openapi3.yaml'
              - '.redocly.yaml'
            tests:
              - *build
              - 'tests/**'
              - '.env'
            docker:
              - *build
              - 'Dockerfile'
              - '.dockerignore'

  eslint:
    name: Run eslint
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24.x]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Init Nodejs
        uses: MapColonies/shared-workflows/actions/init-npm@init-npm-v1
        with:
          node-version: ${{ matrix.node }}

      - name: Run linters
        uses: wearerequired/lint-action@v3
        with:
          eslint: true
          prettier: true
          eslint_extensions: ts
          tsc: true
          continue_on_error: false

  openapi-lint:
    name: Run OpenAPI lint Check
    needs: changes
    if: ${{ needs.changes.outputs.openapi == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Init Nodejs
        uses: MapColonies/shared-workflows/actions/init-npm@init-npm-v1

      - name: OpenAPI Lint Checks
        run: npm run lint:openapi

  helm-lint:
    name: Run Helm lint Check
    needs: changes
    if: ${{ needs.changes.outputs.helm == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Helm Lint Checks
        uses: MapColonies/shared-workflows/actions/helm-lint@helm-lint-v1

  security:
    needs: changes
    if: ${{ needs.changes.outputs.deps == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  tests:
    name: Run Tests
    needs: changes
    if: ${{ needs.changes.outputs.tests == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24.x]
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Init Nodejs
        uses: MapColonies/shared-workflows/actions/init-npm@init-npm-v1
        with:
          node-version: ${{ matrix.node }}

      - name: Run tests
        run: npm run test

      - uses: actions/upload-artifact@v7
        with:
          name: Test Reporters Node-${{ matrix.node }}
          path: reports/**

  build_docker_image:
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          push: false
